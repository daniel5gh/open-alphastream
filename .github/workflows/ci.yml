name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/alphastream-rs
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build (default features)
      run: cargo build --release
    - name: Build (no default features)
      run: cargo check --no-default-features --lib
    - name: Build (all features)
      run: cargo build --release --all-features
    - name: Test
      run: cargo test --all-features
    - name: Package (dry run)
      run: cargo package --locked
    - name: C header is up to date
      run: |
        cargo install cbindgen --locked --version 0.29.0
        cbindgen --config cbindgen.toml --crate alphastream --output /tmp/alphastream.h
        diff -u include/alphastream.h /tmp/alphastream.h