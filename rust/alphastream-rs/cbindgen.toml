language = "C"
include_guard = "ALPHASTREAM_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
header = "/* alphastream C API - generated by cbindgen, do not edit. See cbindgen.toml. */"

[parse]
parse_deps = false

[export]
# Only the C ABI: no Rust-side constants (SOURCE_WIDTH, ...).
item_types = ["functions", "structs", "opaque", "typedefs"]

